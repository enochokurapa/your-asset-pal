services:
  pesapal-db:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:15-alpine
        COPY complete_init.sql /docker-entrypoint-initdb.d/01-init.sql
        COPY saas_policy.sql /docker-entrypoint-initdb.d/03-saas-policy.sql
        COPY scripts/init-role-passwords.sh /docker-entrypoint-initdb.d/04-role-passwords.sh
    container_name: pesapal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ams
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      SUPABASE_AUTH_DB_PASSWORD: "${SUPABASE_AUTH_DB_PASSWORD:?SUPABASE_AUTH_DB_PASSWORD must be set}"
      POSTGREST_DB_PASSWORD: "${POSTGREST_DB_PASSWORD:?POSTGREST_DB_PASSWORD must be set}"
    volumes:
      - pesapal-db-data:/var/lib/postgresql/data
    networks:
      - pesapal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ams"]
      interval: 5s
      timeout: 5s
      retries: 20

  pesapal-auth:
    image: supabase/gotrue:v2.158.1
    container_name: pesapal-auth
    restart: unless-stopped
    depends_on:
      pesapal-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "https://assetflow360.com/auth/v1"
      GOTRUE_API_EXTERNAL_URL: "https://assetflow360.com/auth/v1"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_DB_DATABASE_URL: "${AUTH_DATABASE_URL:?AUTH_DATABASE_URL must be set}"
      GOTRUE_SITE_URL: "https://assetflow360.com"
      GOTRUE_URI_ALLOW_LIST: "https://assetflow360.com/*"
      GOTRUE_JWT_SECRET: "${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET must be set}"
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: "${SMTP_HOST:?SMTP_HOST must be set}"
      GOTRUE_SMTP_PORT: "${SMTP_PORT:-587}"
      GOTRUE_SMTP_USER: "${SMTP_USER:?SMTP_USER must be set}"
      GOTRUE_SMTP_PASS: "${SMTP_PASSWORD:?SMTP_PASSWORD must be set}"
      GOTRUE_SMTP_ADMIN_EMAIL: "${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL must be set}"
      GOTRUE_SMTP_SENDER_NAME: "AssetFlow 360"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: "https://assetflow360.com/auth-email/confirmation.html"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
    expose:
      - "9999"
    # GoTrue is intentionally private. The app proxies /auth/v1 over this network.
    # This avoids Traefik route collisions that can return plain-text 404 responses.
    networks:
      - pesapal

  pesapal-rest:
    image: postgrest/postgrest:v12.2.0
    container_name: pesapal-rest
    restart: unless-stopped
    depends_on:
      pesapal-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "${POSTGREST_DATABASE_URL:?POSTGREST_DATABASE_URL must be set}"
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET must be set}"
    expose:
      - "3000"
    # PostgREST is intentionally private. The app proxies /rest/v1 internally.
    networks:
      - pesapal

  pesapal-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPABASE_PROJECT_ID: "ams-self-hosted"
        SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY must be set}"
        SUPABASE_URL: "https://assetflow360.com"
        VITE_SUPABASE_PROJECT_ID: "ams-self-hosted"
        VITE_SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY must be set}"
        VITE_SUPABASE_URL: "https://assetflow360.com"
    container_name: pesapal-app
    restart: unless-stopped
    depends_on:
      pesapal-auth:
        condition: service_started
      pesapal-rest:
        condition: service_started
    environment:
      SUPABASE_PROJECT_ID: "ams-self-hosted"
      SUPABASE_URL: "https://assetflow360.com"
      SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY must be set}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY must be set}"
      VITE_SUPABASE_PROJECT_ID: "ams-self-hosted"
      VITE_SUPABASE_URL: "https://assetflow360.com"
      VITE_SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY must be set}"
      # Private upstreams used by src/server.ts for same-origin Supabase proxying.
      SUPABASE_AUTH_INTERNAL_URL: "http://pesapal-auth:9999"
      SUPABASE_REST_INTERNAL_URL: "http://pesapal-rest:3000"
      DATABASE_URL: "${DATABASE_URL:-}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      BACKUP_SCHEDULER_DISABLED: "${BACKUP_SCHEDULER_DISABLED:-false}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      BACKUP_EMAIL_FROM: "${BACKUP_EMAIL_FROM:-}"
      PAYMENT_GATEWAY_ENCRYPTION_KEY: "${PAYMENT_GATEWAY_ENCRYPTION_KEY:-}"
      YO_API_USERNAME: "${YO_API_USERNAME:-}"
      YO_API_PASSWORD: "${YO_API_PASSWORD:-}"
      YO_API_MODE: "${YO_API_MODE:-production}"
      YO_API_URL: "${YO_API_URL:-}"
      MICROSOFT_365_CLIENT_ID: "${MICROSOFT_365_CLIENT_ID:-}"
      MICROSOFT_365_CLIENT_SECRET: "${MICROSOFT_365_CLIENT_SECRET:-}"
      MICROSOFT_365_REDIRECT_URI: "${MICROSOFT_365_REDIRECT_URI:-https://assetflow360.com/api/integrations/microsoft/callback}"
      MICROSOFT_365_TOKEN_ENCRYPTION_KEY: "${MICROSOFT_365_TOKEN_ENCRYPTION_KEY:-}"
    ports:
      - "127.0.0.1:4300:3000"
    expose:
      - "3000"
    networks:
      - pesapal
      - edge

networks:
  pesapal:
    name: pesapal-net
  edge:
    external: true
    name: edge

volumes:
  pesapal-db-data:
    external: true
    name: pesapal-db-data
