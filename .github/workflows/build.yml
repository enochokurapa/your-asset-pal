name: Build and deploy AssetFlow360

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetflow-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test application utilities and branding icons
        run: bun test
      - name: Verify payment receipt PDF generation
        run: bun run scripts/test-activation-receipt.ts
      - name: Verify A3 and A4 reports keep all columns together
        run: bun run scripts/test-report-paper.ts
      - name: Stamp PWA service worker with the release revision
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          p=Path("public/sw.js")
          s=p.read_text()
          s=s.replace('const CACHE_NAME = "assetflow-pwa-v4";',
                      'const CACHE_NAME = "assetflow-pwa-"+'+repr(os.environ["RELEASE_SHA"][:12])+';')
          p.write_text(s)
          PYCODE
      - name: Test asset lifecycle verification status
        run: bun run scripts/test-verification-group.ts
      - name: Build application
        run: bun run build
      - name: Upload compiled production bundle
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: assetflow-bundle-${{ github.sha }}
          path: .output/
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Wait for verified production deployment
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Build passed. Waiting for production release agent to deploy commit $EXPECTED_SHA."
          for attempt in $(seq 1 75); do
            served=$(curl -fsSL --connect-timeout 6 --max-time 12 -H 'Cache-Control: no-cache' "https://assetflow360.com/deploy-version.txt?check=$attempt" 2>/dev/null || true)
            if [ "$served" = "$EXPECTED_SHA" ]; then
              echo "Production is serving verified commit $EXPECTED_SHA."
              exit 0
            fi
            echo "Deployment pending (attempt $attempt/75), live revision: ${served:-unavailable}."
            sleep 12
          done
          echo "::error::Production never served the expected commit $EXPECTED_SHA."
          exit 1
