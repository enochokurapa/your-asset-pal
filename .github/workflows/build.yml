name: Build and deploy AssetFlow360

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetflow-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Wait for verified production deployment
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Build passed. Waiting for production release agent to deploy commit $EXPECTED_SHA."
          for attempt in $(seq 1 75); do
            served=$(curl -fsSL --connect-timeout 6 --max-time 12 -H 'Cache-Control: no-cache' "https://assetflow360.com/deploy-version.txt?check=$attempt" 2>/dev/null || true)
            if [ "$served" = "$EXPECTED_SHA" ]; then
              echo "Production is serving verified commit $EXPECTED_SHA."
              exit 0
            fi
            echo "Deployment pending (attempt $attempt/75), live revision: ${served:-unavailable}."
            sleep 12
          done
          echo "::error::Production never served the expected commit $EXPECTED_SHA."
          exit 1
