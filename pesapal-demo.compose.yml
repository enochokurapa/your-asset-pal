      - "traefik.http.routers.pesapal-app-https.rule=Host(`pesapal.owltechsolutionsltd.com`)"
      - "traefik.http.routers.pesapal-app-https.entrypoints=https"
      - "traefik.http.routers.pesapal-app-https.tls=true"
