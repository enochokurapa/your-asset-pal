      - "traefik.http.routers.pesapal-app-https.service=pesapal-app-svc"
      - "traefik.http.services.pesapal-app-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.pesapal-app-http.rule=Host(`pesapal.owltechsolutionsltd.com`)"
